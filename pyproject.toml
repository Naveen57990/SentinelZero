[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelzero"
version = "1.0.0"
description = "Autonomous Zero-Trust API & MCP Security Auditor"
readme = "README.md"
authors = [{ name = "Naveen57990" }]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0"
]

[project.scripts]
sentinelzero = "sentinelzero.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinelzero*"]

[tool.pytest.ini_options]
pythonpath = ["."]
